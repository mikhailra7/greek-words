name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: make setup-backend
      - run: make lint-backend
      - run: make test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run format:check && npm run build
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make setup
      - name: Chromium
        working-directory: frontend
        run: PLAYWRIGHT_BROWSERS_PATH=../.tools/ms-playwright npx playwright install --with-deps chromium
      - run: make e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  # The same images the server builds, started together: HTTPS (Caddy's local CA for
  # "localhost"), SPA routes, /api through the proxy, /media closed without a session.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .env for the smoke test
        run: |
          cp .env.example .env
          echo "DOMAIN=localhost" >> .env
          echo "TTS_ENABLED=false" >> .env
          mkdir -p data media && sudo chown -R 1000:1000 data media
      - run: docker compose build
      - run: docker compose run --rm --no-deps web caddy validate --config /etc/caddy/Caddyfile
      - run: docker compose up -d --wait --wait-timeout 120
      - name: Smoke test
        run: |
          set -x
          get() { curl -sk -o /dev/null -w '%{http_code}' "https://localhost$1"; }
          test "$(curl -sk https://localhost/api/health)" = '{"status":"ok"}'
          test "$(get /)" = 200
          test "$(get /dictionaries/1)" = 200          # SPA route -> index.html
          curl -sk https://localhost/study | grep -q '<div id="root">'
          test "$(get /api/docs)" = 404                # ENV=prod
          test "$(get /media/images/x.jpg)" = 401      # no session
          test "$(get /api/dictionaries)" = 401
          # First user becomes admin; the cookie must be Secure; media works with a session.
          curl -sk -c jar -H 'Content-Type: application/json' \
            -d '{"username":"ci_admin","password":"ci-pass-1"}' https://localhost/api/auth/register -D headers
          grep -i '^set-cookie:.*secure' headers
          test "$(curl -sk -b jar -o /dev/null -w '%{http_code}' https://localhost/api/dictionaries)" = 200
          test "$(curl -sk -b jar -o /dev/null -w '%{http_code}' https://localhost/media/images/none.jpg)" = 404
          # Backup script against the running stack.
          sudo deploy/backup.sh
          sudo tar -tzf backups/greek-data-*.tar.gz | grep -x data/greek.db
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - run: docker compose down -v
        if: always()
